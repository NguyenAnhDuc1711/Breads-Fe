name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      # ~11 pre-existing lint errors in the codebase (unrelated to new PRs) mean this
      # can't be a required check yet. Keep it visible in logs without blocking merges.
      - name: Lint (non-blocking)
        continue-on-error: true
        run: npm run lint

      - run: npm run build
