name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      # 11 pre-existing errors + 3 warnings (react/jsx-key, rules-of-hooks,
      # no-unescaped-entities...) surfaced the first run — not a required check yet.
      - name: Lint (non-blocking)
        continue-on-error: true
        run: npx next lint

      # 13 pre-existing type errors — not a required check yet.
      - name: Type-check (non-blocking)
        continue-on-error: true
        run: npx tsc --noEmit

      # No test framework (Jest/Vitest) is set up yet — unit-test step intentionally
      # omitted until one exists with real test cases.

      # 17 pre-existing vulnerabilities (1 critical, 13 high, 3 moderate) surfaced the
      # first run — not a required check yet, same treatment as lint/type-check above.
      - name: Dependency audit (non-blocking)
        continue-on-error: true
        run: npm audit --audit-level=high

      # Filesystem scan (not the built image) — vuln covers npm deps, secret catches
      # committed credentials, misconfig checks the Dockerfile. exit-code 0 keeps this
      # non-blocking for the same reason as the steps above.
      - name: Trivy scan (non-blocking)
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"
